services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import:ro
