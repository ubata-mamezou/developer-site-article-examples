name: npm audit fix reusable

on:
  workflow_call:
    inputs:
      project:
        required: false
        default: mcp-auth
        type: string
      node-version:
        required: false
        default: "26"
        type: string
      test-run:
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: audit-fix-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    name: 修正と検証
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.repair.outputs.changed }}
    steps:
      - name: ベースブランチを確認
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "既定ブランチから実行してください。" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: ツールの型チェックとテスト
        run: |
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix tools
          npm test --prefix tools
      - name: 模擬npmを準備
        if: inputs.test-run
        run: |
          node tools/src/mock-npm-setup.ts "$RUNNER_TEMP/audit-fix-mock-bin"
          echo "$RUNNER_TEMP/audit-fix-mock-bin" >> "$GITHUB_PATH"
          echo "テスト実行: 指定projectを無視し、専用フィクスチャを使用します。"
      - name: 修正・ビルド・テスト・再監査
        id: repair
        env:
          PROJECT: ${{ inputs.test-run && 'tools/fixtures/audit-fix' || inputs.project }}
          NPM_CONFIG_MIN_RELEASE_AGE: "7"
          NPM_CONFIG_FORCE: "false"
          NPM_CONFIG_AUDIT_LEVEL: "info"
        run: node tools/src/audit-fix.ts prepare "$PROJECT" "$RUNNER_TEMP/audit-fix.patch"
      - name: 差分を保存
        if: steps.repair.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-fix-patch
          path: ${{ runner.temp }}/audit-fix.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 専用ブランチへ反映
    needs: repair
    if: needs.repair.result == 'success' && needs.repair.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audit-fix-patch
          path: ${{ runner.temp }}/audit-fix
      - name: 差分の検証
        env:
          PROJECT: ${{ inputs.test-run && 'tools/fixtures/audit-fix' || inputs.project }}
        # RUNNER_TEMP: GitHub Actionsが提供する一時ディレクトリのパス
        run: node tools/src/audit-fix.ts apply "$PROJECT" "$RUNNER_TEMP/audit-fix/audit-fix.patch"
      - name: 専用ブランチへpush
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.sha }}
          TEST_RUN: ${{ inputs.test-run }}
        run: |
          set -eu
          current_sha="$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          if [ "$current_sha" != "$BASE_SHA" ]; then
            echo "ベースブランチが更新されたため中止します。" >&2
            exit 1
          fi
          if [ "$TEST_RUN" = "true" ]; then
            branch="automation/audit-fix-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            message="test: simulate npm audit fix"
          else
            branch="automation/audit-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            message="fix: remediate npm vulnerabilities"
          fi
          # GitHub Actionsで規定されているユーザー名とメールアドレスを設定
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -u
          git commit -m "$message" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/$branch"
          echo "作成したブランチ: $branch"
