name: mcp-auth CI

on:
  workflow_dispatch:
  push:
    paths:
      - "mcp-auth/**"
      - ".github/workflows/mcp-auth.yml"
      - ".betterleaks.toml"
      - ".betterleaksignore"
  pull_request:
    paths:
      - "mcp-auth/**"
      - ".github/workflows/mcp-auth.yml"
      - ".betterleaks.toml"
      - ".betterleaksignore"

defaults:
  run:
    working-directory: mcp-auth

env:
  betterleaks_version: v1.8.0

jobs:
  # ──────────────────────────────────────────
  # シークレットスキャン
  # .betterleaksignore によりローカル開発用ダミー値は除外される
  # memo: betterleaksはGitleaksの後継
  # ──────────────────────────────────────────
  secret-scan:
    name: Secret Scan (betterleaks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "."   # betterleaks はリポジトリルートで動かす
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0         # 全履歴をスキャン対象にする

      - name: Install betterleaks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL \
            "https://github.com/betterleaks/betterleaks/releases/download/${{ env.betterleaks_version }}/betterleaks_Linux_x86_64.tar.gz" \
            | tar -xz betterleaks
          sudo install -m 755 betterleaks /usr/local/bin/
          rm betterleaks

      - name: Scan for secrets
        run: betterleaks git .

  # ──────────────────────────────────────────
  # ビルド
  # ──────────────────────────────────────────
  build:
    name: Build (TypeScript)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: mcp-auth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
