name: npm audit fix

on:
  workflow_dispatch:
    inputs:
      project:
        description: npmプロジェクトのリポジトリ相対パス（テスト実行時は無視）
        required: true
        default: mcp-auth
        type: string
      node-version:
        description: 使用するNode.jsのバージョン
        required: true
        default: "26"
        type: string
      test-run:
        description: 模擬npmと専用フィクスチャで実行する
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  audit-fix:
    permissions:
      contents: write
    uses: ./.github/workflows/audit-fix-reusable.yml
    with:
      project: ${{ inputs.project }}
      node-version: ${{ inputs.node-version }}
      test-run: ${{ inputs.test-run }}
