name: npm audit fix

on:
  workflow_dispatch:
    inputs:
      project:
        description: npmプロジェクトのリポジトリ相対パス（テスト実行時は無視）
        required: true
        default: mcp-auth
        type: string
      node-version:
        description: 使用するNode.jsのバージョン
        required: true
        default: "26"
        type: string
      test-run:
        description: 模擬npmと専用フィクスチャで実行する
        required: true
        default: false
        type: boolean
      branch-prefix:
        description: 作成するブランチ名のprefix（公開リポジトリでは公開されます）
        required: true
        default: automation/audit-fix
        type: string
      auto-minor:
        description: マイナー更新を自動対応する
        required: true
        default: true
        type: boolean
      auto-patch:
        description: パッチ更新を自動対応する
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  audit-fix:
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/_audit-fix.yml
    with:
      project: ${{ inputs.project }}
      node-version: ${{ inputs.node-version }}
      test-run: ${{ inputs.test-run }}
      branch-prefix: ${{ inputs.branch-prefix }}
      auto-minor: ${{ inputs.auto-minor }}
      auto-patch: ${{ inputs.auto-patch }}
