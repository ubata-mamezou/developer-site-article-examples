name: mcp-auth-streamable-http CI

on:
  push:
    paths:
      - "mcp-auth-streamable-http/**"
      - ".github/workflows/mcp-auth-streamable-http.yml"
      - ".betterleaks.toml"
      - ".betterleaksignore"
  pull_request:
    paths:
      - "mcp-auth-streamable-http/**"
      - ".github/workflows/mcp-auth-streamable-http.yml"
      - ".betterleaks.toml"
      - ".betterleaksignore"

defaults:
  run:
    working-directory: mcp-auth-streamable-http

jobs:
  # ──────────────────────────────────────────
  # シークレットスキャン
  # .betterleaksignore によりローカル開発用ダミー値は除外される
  # ──────────────────────────────────────────
  secret-scan:
    name: Secret Scan (betterleaks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "."   # betterleaks はリポジトリルートで動かす
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0         # 全履歴をスキャン対象にする

      - name: Install betterleaks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(gh release view --repo betterleaks/betterleaks --json tagName -q .tagName)
          curl -sSfL \
            "https://github.com/betterleaks/betterleaks/releases/download/${VERSION}/betterleaks_Linux_x86_64.tar.gz" \
            | tar -xz betterleaks
          sudo install -m 755 betterleaks /usr/local/bin/
          rm betterleaks

      - name: Scan for secrets
        run: betterleaks git .

  # ──────────────────────────────────────────
  # ビルド
  # ──────────────────────────────────────────
  build:
    name: Build (TypeScript)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mcp-auth-streamable-http/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
