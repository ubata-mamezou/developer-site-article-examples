# betterleaks 設定ファイル
# ref: https://github.com/betterleaks/betterleaks/blob/main/docs/config.md

title = "developer-site-article-examples betterleaks config"

# ローカル検証専用ファイルを、ファイル単位でスキャン対象から除外する。
prefilter = '''
filter.matchesAny(attributes["path"], [
  `^mcp-auth/keycloak/realm-import/mcp-demo-realm\.json$`,
  `^mcp-auth/\.env\.example$`,
  `^mcp-auth/docker-compose\.yml$`,
  `^mcp-auth-streamable-http/docker-compose\.yml$`,
  `^mcp-auth-streamable-http/keycloak/realm-import/mcp-demo-realm\.json$`,
  `^mcp-auth-streamable-http/\.env\.example$`,
  `^mcp-auth-streamable-http/README\.md$`
])
'''

# 値単位で除外する場合はこちらを有効化する。
# ファイル単位で除外しないため、同じファイルに実値を記載した場合も検出できる。
filter = '''
finding["secret"] in [
  "bad_format_token",
  "unknown_token",
  "dummy1234",
]
'''

[extend]
  # betterleaks 公式のデフォルトルールセットを継承する
  useDefault = true
