# finding["secret"] in [
#   "mcp-server-secret",
#   "mcp-demo-client-secret",
#   "mcp-demo-no-scope-client-secret",
#   "mcp-demo-no-audience-client-secret",
#   "mcp-demo-diff-audience-client-secret"
# ]
# '''
